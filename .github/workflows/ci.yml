name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Show affected (PR)
        if: github.event_name == 'pull_request'
        run: |
          npx nx show projects --affected \
            --base=${{ github.event.pull_request.base.sha }} \
            --head=${{ github.sha }}

      - name: Show affected (push)
        if: github.event_name == 'push'
        run: |
          npx nx show projects --affected \
            --base=${{ github.event.before }} \
            --head=${{ github.sha }}

      - name: Build affected (PR)
        if: github.event_name == 'pull_request'
        run: |
          npx nx affected -t build \
            --base=${{ github.event.pull_request.base.sha }} \
            --head=${{ github.sha }}

      - name: Build affected (push)
        if: github.event_name == 'push'
        run: |
          npx nx affected -t build \
            --base=${{ github.event.before }} \
            --head=${{ github.sha }}

      - name: Test affected (PR)
        if: github.event_name == 'pull_request'
        run: |
          npx nx affected -t test \
            --base=${{ github.event.pull_request.base.sha }} \
            --head=${{ github.sha }}

      - name: Test affected (push)
        if: github.event_name == 'push'
        run: |
          npx nx affected -t test \
            --base=${{ github.event.before }} \
            --head=${{ github.sha }}
