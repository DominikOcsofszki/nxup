name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Set SHAs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
          echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Show affected
        run: npx nx show projects --affected --base=$BASE_SHA --head=$HEAD_SHA

      - name: Build affected
        run: npx nx affected -t build --base=$BASE_SHA --head=$HEAD_SHA --parallel=4

      - name: Test affected
        run: npx nx affected -t test --base=$BASE_SHA --head=$HEAD_SHA --parallel=4
